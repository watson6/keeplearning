---
layout: default
---
<section class="page-head">
  <div class="container">
    <p class="eyebrow reveal">{{ page.eyebrow | default: page.title }}</p>
    <h1 class="page-head__title reveal" style="--d:60ms">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="page-head__desc reveal" style="--d:120ms">{{ page.description }}</p>
    {%- endif %}
  </div>
</section>

<section class="section" style="padding-top:clamp(24px,3vw,44px)">
  <div class="container">
    <div class="project-body">
      <div class="prose reveal" style="--d:160ms">
        {{ content }}
      </div>

      {%- if page.aside %}
      <aside class="project-aside reveal" style="--d:220ms">
        {{ page.aside | markdownify }}
      </aside>
      {%- endif %}
    </div>
  </div>
</section>

{% include cta.html %}
